name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks; main keeps
# every run so each merged revision has its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flake-check:
    name: nix flake check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # Avoids anonymous GitHub API rate limits when fetching flake inputs.
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # felis declares its binary cache in its own flake's nixConfig, which
          # applies only when felis is the top-level flake; without it every
          # run rebuilds the felis daemon the package wraps.
          extra_nix_config: |
            extra-substituters = https://nix-cache.natsukium.com
            extra-trusted-public-keys = niks3-1:SoIFTPtiPoCW3/OzUkIBKlLG5znMZfbihlr11XAOles=
      # Main supplies the cache to pull requests; untrusted PRs never publish it.
      - name: Restore Nix build cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-deps-v1-${{ matrix.system }}-${{ hashFiles('flake.nix', 'flake.lock', '**/Cargo.toml', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-deps-v1-${{ matrix.system }}-
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          gc-max-store-size: 4G
      # Keep the shared Crane dependency artifacts through cache garbage collection.
      - name: Root Rust dependencies for the cache
        run: nix build .#ci-deps --out-link "$RUNNER_TEMP/nekomata-ci-deps" --print-build-logs
      # The felis input and its Cargo crates come from git.natsukium.com.
      - run: nix flake check --print-build-logs --keep-going
