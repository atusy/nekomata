name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks; main keeps
# every run so each merged revision has its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flake-check:
    name: nix flake check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # Avoids anonymous GitHub API rate limits when fetching flake inputs.
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # felis declares its binary cache in its own flake's nixConfig, which
          # applies only when felis is the top-level flake; without it every
          # run rebuilds the felis daemon the package wraps.
          extra_nix_config: |
            extra-substituters = https://nix-cache.natsukium.com
            extra-trusted-public-keys = niks3-1:SoIFTPtiPoCW3/OzUkIBKlLG5znMZfbihlr11XAOles=
      # The felis input and its Cargo crates come from git.natsukium.com.
      - run: nix flake check --print-build-logs --keep-going
