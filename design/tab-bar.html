<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>nekomata — Tab bar studies</title>
<style>
:root{color-scheme:dark;--bg:#14171f;--fg:#d8dee9;--accent:#a3be8c;--muted:#8c95a7;--line:#303541;--surface:#202530}
*{box-sizing:border-box}body{margin:0;background:#101219;color:var(--fg);font-family:system-ui,-apple-system,sans-serif;font-size:14px}main{max-width:1440px;margin:auto;padding:56px 36px 72px}header{margin-bottom:40px}h1{font-size:28px;letter-spacing:-.7px;font-weight:550;margin:8px 0 12px}.eyebrow{color:var(--accent);font:11px ui-monospace,monospace;letter-spacing:2px}header p{color:var(--muted);line-height:1.8;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 26px}.caption{display:flex;align-items:baseline;gap:12px;margin:0 0 10px}.number{font:11px ui-monospace,monospace;color:var(--accent)}h2{font-size:14px;font-weight:550;margin:0}.description{color:var(--muted);font-size:12px;margin:10px 0 0;line-height:1.7}.window{border:1px solid #2b303b;border-radius:9px;overflow:hidden;background:var(--bg)}.bar{height:44px;display:flex;align-items:stretch;background:#181c25;border-bottom:1px solid #292e39;padding:0 8px;gap:3px;overflow-x:auto;scrollbar-width:thin}button{font:inherit;color:inherit;border:0;background:transparent;cursor:pointer;flex-shrink:0}button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}.menu{width:30px;color:var(--muted);font-size:21px;margin-right:3px}.tabs{display:flex;gap:3px;align-items:stretch;flex-shrink:0}.tab{position:relative;color:var(--muted);padding:0 15px;font-size:12px;transition:background .15s,color .15s}.tab:hover{color:var(--fg);background:#ffffff06}.tab[aria-selected=true]{color:var(--fg)}.plus{margin-left:auto;width:28px;color:var(--muted);font-size:19px}.terminal{height:122px;padding:19px 20px;font:12px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;color:#8c95a7;overflow:hidden}.prompt{color:var(--accent)}.path{color:#b6c4d7}.output{color:#657085}.cursor{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px}.tag{margin-left:auto;color:#697384;font-size:10px;letter-spacing:.5px}
/* 01: A quiet underline. */
.v1 .tab[aria-selected=true]::after{content:"";position:absolute;bottom:0;left:14px;right:14px;height:2px;background:var(--accent)}
/* 02: Tonal, inset surfaces. */
.v2 .bar{align-items:center}.v2 .tabs{height:30px}.v2 .tab{border-radius:5px}.v2 .tab[aria-selected=true]{background:#303744}
/* 03: The active surface joins the terminal. */
.v3 .bar{padding-top:6px;gap:0}.v3 .tab{border-radius:6px 6px 0 0}.v3 .tab[aria-selected=true]{background:var(--bg);box-shadow:inset 0 1px #414957}.v3 .bar{border-bottom:0}.v3 .tab[aria-selected=true]::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--accent)}
/* 04: Rounded tonal pill. */
.v4 .bar{align-items:center}.v4 .tabs{height:29px}.v4 .tab{border-radius:20px}.v4 .tab[aria-selected=true]{background:#a3be8c20;color:#c5d9b5}
/* 05: Thin border, no strong fill. */
.v5 .bar{align-items:center}.v5 .tabs{height:30px}.v5 .tab{border:1px solid transparent;border-radius:4px}.v5 .tab[aria-selected=true]{border-color:#a3be8c80;background:#a3be8c08}
/* 06: A vertical marker. */
.v6 .tab[aria-selected=true]{background:#242b34}.v6 .tab[aria-selected=true]::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:2px;background:var(--accent)}
/* 07: Index as the active marker. */
.v7 .index{font:10px ui-monospace,monospace;color:#697384;margin-right:8px;padding:3px 5px;border-radius:3px}.v7 .tab{padding:0 10px}.v7 .tab[aria-selected=true] .index{background:var(--accent);color:#18201b}.v7 .tab[aria-selected=true]{background:#ffffff04}
/* 08: Top-edge marker. */
.v8 .tab{border-right:1px solid #ffffff08}.v8 .tab[aria-selected=true]{background:#252b36;box-shadow:inset 0 2px var(--accent)}
/* 09: A segmented track. */
.v9 .bar{align-items:center}.v9 .tabs{height:32px;background:#11151c;border:1px solid #303642;border-radius:6px;padding:2px;gap:2px}.v9 .tab{border-radius:3px;padding:0 13px}.v9 .tab[aria-selected=true]{background:#343d47;color:#e0ead8;box-shadow:0 1px 3px #0004}
/* 10: Full-width tabs; neutral active face and accent text. */
.v10 .tabs{flex:1;min-width:0;gap:0}.v10 .tab{flex:1;min-width:90px;border-left:1px solid #2b303a;padding:0 10px}.v10 .tab[aria-selected=true]{background:#252c35;color:#c5d9b5;font-weight:600}.v10 .tab[aria-selected=true]::after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:#a3be8c80}
footer{margin-top:36px;color:var(--muted);font-size:12px;line-height:1.8}@media(max-width:900px){.grid{grid-template-columns:1fr}main{padding:30px 18px}.tag{display:none}}@media(prefers-reduced-motion:reduce){.tab{transition:none}}
</style>
</head>
<body><main>
<header><span class="eyebrow">NEKOMATA / UI STUDIES</span><h1>静かなタブ、明確なフォーカス。</h1><p>既存の濃紺とセージグリーンでつくる、10通りのタブバー。<br>各プレビューのタブをクリックして状態を比較できます。タブ内では ← → / Home / End も使えます。</p></header>
<div class="grid" id="studies"></div>
<footer>共通カラー：背景 #14171F · 文字 #D8DEE9 · アクセント #A3BE8C<br>メニュー・追加ボタンは外観のみ。タブ切り替えで、サンプル端末の表示が変わります。</footer>
</main>
<script>
const variants=[
['Underline','細い下線だけで選択を示す、最も控えめな案。'],
['Soft rectangle','明度差のある小さな面で選択を示す、素直な案。'],
['Connected tab','選択中のタブが端末面につながり、所属が伝わる案。'],
['Sage pill','丸い面と淡い緑で、柔らかく選択を示す案。'],
['Fine outline','細い枠で輪郭を強調し、背景の変化を抑える案。'],
['Side marker','左の短い線と面で、コンパクトに状態を示す案。'],
['Indexed tabs','番号にアクセントを集め、タイトル周囲を静かに保つ案。'],
['Top edge','上端の線と縦の区切りで、各タブを明確に分ける案。'],
['Segmented track','ひとつのトラックに収め、切り替え操作のまとまりを出す案。'],
['Equal width','均等幅の面で配置を整え、長さの異なる名前にも統一感を出す案。']
];
const names=['nekomata','felis','~ / fish'];
function select(section,index,focus=false){const buttons=[...section.querySelectorAll('[role=tab]')];buttons.forEach((button,i)=>{button.setAttribute('aria-selected',String(i===index));button.tabIndex=i===index?0:-1});section.querySelector('.path').textContent=['~/src/nekomata','~/src/felis','~'][index];section.querySelector('.command').textContent=['git status --short','cargo check','pwd'][index];section.querySelector('.output').textContent=['On branch main · working tree clean','Finished dev profile in 0.42s','/Users/atusy'][index];if(focus)buttons[index].focus()}
variants.forEach(([name,description],i)=>{const section=document.createElement('section');section.className=`study v${i+1}`;section.innerHTML=`<div class="caption"><span class="number">${String(i+1).padStart(2,'0')}</span><h2 id="title-${i}">${name}</h2>${i===0||i===2?'<span class="tag">RECOMMENDED</span>':''}</div><div class="window"><div class="bar"><button class="menu" aria-label="メニュー（外観のみ）" aria-disabled="true">≡</button><div class="tabs" role="tablist" aria-labelledby="title-${i}">${names.map((label,j)=>`<button class="tab" role="tab" id="tab-${i}-${j}" aria-selected="${j===0}" aria-controls="panel-${i}" tabindex="${j===0?0:-1}">${i===6?`<span class="index">${j+1}</span>`:''}${label}</button>`).join('')}</div><button class="plus" aria-label="タブ追加（外観のみ）" aria-disabled="true">+</button></div><div class="terminal" id="panel-${i}" role="tabpanel" aria-labelledby="tab-${i}-0"><div><span class="path">~/src/nekomata</span> <span style="color:#687489">main</span></div><div><span class="prompt">❯</span> <span class="command">git status --short</span></div><div class="output">On branch main · working tree clean</div><div><span class="prompt">❯</span> <span class="cursor"></span></div></div></div><p class="description">${description}</p>`;section.querySelectorAll('[role=tab]').forEach((button,j)=>{function activate(index,focus){select(section,index,focus);section.querySelector('[role=tabpanel]').setAttribute('aria-labelledby',`tab-${i}-${index}`)}button.addEventListener('click',()=>activate(j,false));button.addEventListener('keydown',event=>{let next;if(event.key==='ArrowRight')next=(j+1)%3;else if(event.key==='ArrowLeft')next=(j+2)%3;else if(event.key==='Home')next=0;else if(event.key==='End')next=2;else return;event.preventDefault();activate(next,true)})});document.getElementById('studies').append(section)});
</script></body></html>
