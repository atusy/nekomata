[package]
name = "nekomata"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A tabbed and split-pane GUI for felis sessions"

[dependencies]
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "persistence", "wgpu", "wayland", "x11"] }
felis-client-core = { git = "https://git.natsukium.com/felis-terminal/felis", rev = "2a3030b237947497708b962ba6be8c2adade4951" }
felis-grid = { git = "https://git.natsukium.com/felis-terminal/felis", rev = "2a3030b237947497708b962ba6be8c2adade4951" }
felis-protocol = { git = "https://git.natsukium.com/felis-terminal/felis", rev = "2a3030b237947497708b962ba6be8c2adade4951" }
felis-transport = { git = "https://git.natsukium.com/felis-terminal/felis", rev = "2a3030b237947497708b962ba6be8c2adade4951" }
felis-render-core = { git = "https://git.natsukium.com/felis-terminal/felis", rev = "2a3030b237947497708b962ba6be8c2adade4951" }
felis-shaping = { git = "https://git.natsukium.com/felis-terminal/felis", rev = "2a3030b237947497708b962ba6be8c2adade4951" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
memmap2 = "0.9"
swash = "0.2"
toml = "1"

# Small shared-device embedding API over the pinned upstream renderer.
felis-render-wgpu = { path = "vendor/felis-render-wgpu" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFString", "CFURL"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFontDescriptor"] }

# dlopen: as in felis-shaping, a missing libfontconfig leaves the UI on
# its default font instead of failing to start.
[target.'cfg(not(target_os = "macos"))'.dependencies]
yeslogic-fontconfig-sys = { version = "6.0.1", features = ["dlopen"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
yeslogic-fontconfig-sys = { version = "6.0.1", features = ["dlopen"] }

[dev-dependencies]
tempfile = "3"
